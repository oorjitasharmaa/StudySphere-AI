{% extends "base.html" %}


{% block title %}
    AI Quiz | StudySphere AI
{% endblock %}


{% block content %}

<section class="content-shell">

    <!-- Page Header -->
    <div class="content-top">

        <div>

            <div class="eyebrow">
                AI PRACTICE QUIZ
            </div>

            <h1>
                {{ document.original_filename }}
            </h1>

        </div>


        <a
            href="{{ url_for('dashboard') }}"
            class="secondary-btn"
        >
            ← Back to Dashboard
        </a>

    </div>


    <!-- AI Generated Quiz -->
    <div class="ai-output">
        {{ quiz | safe}}
    </div>


    <!-- Quiz Actions -->
    <div class="content-actions">

        <a
            href="{{ url_for('quiz', document_id=document.id) }}"
            class="primary-btn"
        >
            Generate New Quiz
        </a>


        <a
            href="{{ url_for('chat', document_id=document.id) }}"
            class="secondary-btn"
        >
            Ask Questions
        </a>

    </div>

</section>

{% endblock %}
