{% extends "base.html" %}


{% block title %}
    Create Account | StudySphere AI
{% endblock %}


{% block content %}

<div class="auth-wrap">

    <section class="auth-card">

        <div class="eyebrow">
            START FOR FREE
        </div>

        <h1>Create Your Study Space</h1>


        <!-- Signup Form -->
        <form method="POST">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                minlength="3"
                placeholder="At least 3 characters"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                minlength="6"
                placeholder="At least 6 characters"
                required
            >


            <button
                type="submit"
                class="primary-btn full"
            >
                Create Account
            </button>

        </form>


        <p class="muted center">
            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>
        </p>

    </section>

</div>

{% endblock %}
